   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start" x="25.335" y="25.82784" transform="rotate(-0 25.335 25.82784)">Controlled experiment: separate conditioning, density, and decoder sensitivity</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172a3b" transform="translate(182.261047 77.035556)">Fixed throughout: E / D weights + normalization + graph hierarchy</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172a3b" transform="translate(127.538625 89.353149)">Condition c = geometry + thickness + recorded B.C.; vary only the random realization</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172a3b" transform="translate(51.597656 148.492759)">0. Validate paths</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172a3b" transform="translate(42.171172 160.810352)">GT / posterior / prior</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172a3b" transform="translate(49.934766 173.127946)">checkpoint parity</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172a3b" transform="translate(226.620078 148.492759)">1. Fit one condition</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172a3b" transform="translate(219.105703 160.810352)">Can a prior reproduce</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172a3b" transform="translate(235.285156 173.127946)">its latent cloud?</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172a3b" transform="translate(405.387656 148.492759)">2. Compare families</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172a3b" transform="translate(409.371719 160.810352)">FM / EDM / implicit</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172a3b" transform="translate(412.774844 173.127946)">same conditioner</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172a3b" transform="translate(584.027188 148.492759)">3. Change one factor</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172a3b" transform="translate(585.984844 160.810352)">graph-token context</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172a3b" transform="translate(599.273359 173.127946)">then field score</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172a3b" transform="translate(65.533906 244.736599)">Split A: new realizations at known conditions</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172a3b" transform="translate(59.389375 257.054192)">Split B: held-out geometries / thickness ranges</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172a3b" transform="translate(79.380156 269.371786)">No test targets in a training latent bank</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172a3b" transform="translate(440.309844 244.736599)">Measure joint latent + field distributions</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172a3b" transform="translate(422.348906 257.054192)">PV / tails / spatial dependence / B.C. residuals*</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #172a3b" transform="translate(432.951875 269.371786)">Report three seeds, time and denoiser NFE</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #586575" x="25.335" y="306.79776" transform="rotate(-0 25.335 306.79776)">Proposed procedure, not completed training. * B.C. residuals require verified physical constraints.</text>
   </g>
  </g>
 </g>
